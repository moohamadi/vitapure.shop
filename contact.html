<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماس با ما | VitaPure</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white text-gray-800 antialiased">

    <nav id="navbar" class="w-full bg-white border-b border-gray-100 py-4">
        <div class="max-w-5xl mx-auto px-6 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                <svg class="w-8 h-8 text-brand" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                VitaPure
            </a>
            <a href="index.html" class="text-sm text-gray-500 hover:text-brand transition-colors">
                بازگشت به فروشگاه
            </a>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto px-6 py-12">
        <div class="bg-white rounded-2xl border border-gray-100 p-8 sm:p-12">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 mb-2">تماس با ما</h1>
            <div class="w-16 h-1 bg-brand rounded mb-8"></div>

            <div class="grid sm:grid-cols-2 gap-8 mb-8">
                <div>
                    <h2 class="font-bold text-gray-900 mb-4">اطلاعات تماس</h2>
                    <div class="space-y-4">
                        <div>
                            <p class="text-sm text-gray-500">ایمیل</p>
                            <a href="mailto:support@vitapure.shop" class="text-brand hover:underline font-medium">support@vitapure.shop</a>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500">تلفن پشتیبانی</p>
                            <a href="tel:+989120000000" class="text-brand hover:underline font-medium" dir="ltr">+98 912 000 0000</a>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500">ساعات کاری</p>
                            <p class="font-medium text-gray-900">شنبه تا چهارشنبه: ۹ صبح تا ۶ شام</p>
                            <p class="text-sm text-gray-600">پنج‌شنبه و جمعه: تعطیل</p>
                        </div>
                    </div>
                </div>

                <div>
                    <h2 class="font-bold text-gray-900 mb-4">شبکه‌های اجتماعی</h2>
                    <div class="space-y-2">
                        <a href="#" class="block text-brand hover:underline">📱 اینستاگرام</a>
                        <a href="#" class="block text-brand hover:underline">💬 تلگرام</a>
                        <a href="#" class="block text-brand hover:underline">📞 واتس‌اپ</a>
                    </div>
                </div>
            </div>

            <div class="border-t border-gray-100 pt-8">
                <h2 class="font-bold text-gray-900 mb-4">پیام برای ما</h2>
                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">نام</label>
                        <input type="text" placeholder="نام خود را وارد کنید" 
                               class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">ایمیل</label>
                        <input type="email" placeholder="ایمیل خود را وارد کنید"
                               class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">پیام</label>
                        <textarea placeholder="پیام خود را بنویسید..." rows="4"
                                  class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand transition-colors resize-none"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 rounded-xl transition-colors">
                        ارسال پیام
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
